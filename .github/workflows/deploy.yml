name: Build and Deploy to VPS

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Клонирование репозитория
      - name: Checkout code
        uses: actions/checkout@v3

      # Установка JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # Сборка проекта
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Проверка наличия JAR-файла
      - name: List target directory
        run: ls -la target/

      # Логин на VPS через SSH
      - name: Deploy to VPS
        env:
          SSH_USER: homic
          SSH_HOST: 91.146.28.240
          SSH_PASSWORD: homic
        run: |
          # Копируем файлы с использованием sshpass
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no target/CICD-0.0.1-SNAPSHOT.jar $SSH_USER@$SSH_HOST:/home/$SSH_USER/app/app.jar
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no Dockerfile $SSH_USER@$SSH_HOST:/home/$SSH_USER/app/Dockerfile

          # Выполняем команды на сервере
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << EOF
            # Останавливаем и удаляем старый контейнер
            docker stop spring-app || true
            docker rm spring-app || true
            docker rmi spring-app:latest || true

            # Собираем и запускаем контейнер
            cd /home/$SSH_USER/app
            docker build -t spring-app:latest .
            docker run -d --name spring-app -p 8080:8080 spring-app:latest
          EOF